
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver Tutorial</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .tutorial {
      max-width: 900px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 24px #00000012;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .languages {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    .lang {
      background: #e5e7eb;
      color: #111827;
    }

    .lang.active {
      background: #166534;
      color: white;
    }

    .close {
      background: #fee2e2;
      color: #991b1b;
    }

    .video-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 12px;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .status {
      margin: 12px 0;
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .primary {
      background: #166534;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #172033;
    }

    .error {
      color: #b91c1c;
      font-weight: 600;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin-top: 14px;
    }

    .dashboard {
      max-width: 900px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tile {
      background: white;
      padding: 18px;
      border-radius: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .tutorial { padding: 12px; }
      .dashboard { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <section class="tutorial" id="tutorial">
    <div class="topbar">
      <strong id="heading">Driver Training Tutorial</strong>

      <div class="languages">
        <button class="lang active" id="urduBtn" type="button">
          اردو
        </button>
        <button class="lang" id="englishBtn" type="button">
          English
        </button>
      </div>

      <button class="close" id="closeBtn" type="button">
        Close
      </button>
    </div>

    <div class="video-area" id="videoArea">
      <div id="player"></div>
    </div>

    <div class="status" id="status" aria-live="polite">
      Loading video player...
    </div>

    <div class="actions">
      <button class="primary" id="playBtn" type="button">
        Play Video
      </button>
      <button class="secondary" id="fullscreenBtn" type="button">
        Full Screen
      </button>
      <button class="secondary" id="resumeBtn" type="button">
        Resume Tutorial
      </button>
    </div>

    <p class="note" id="note">
      Your video progress is saved in this browser for testing.
    </p>
  </section>

  <section class="dashboard">
    <div class="tile">
      <strong>New Invoice</strong>
      <p>Create a new driver invoice.</p>
    </div>
    <div class="tile">
      <strong>Target Setup</strong>
      <p>Manage your earning target.</p>
    </div>
    <div class="tile">
      <strong>Charge Setup</strong>
      <p>Manage your charges.</p>
    </div>
    <div class="tile">
      <strong>Reports</strong>
      <p>View your earning records.</p>
    </div>
  </section>

  <script>
    const VIDEOS = {
      ur: "xFGi__79snw",
      en: "EVV4h_WpcUo"
    };

    const STORAGE_KEY = "driverTutorialDemoV2";

    let player = null;
    let currentLanguage = "ur";
    let ready = false;
    let saveTimer = null;
    let savedPositions = { ur: 0, en: 0 };
    let completed = { ur: false, en: false };

    const statusEl = document.getElementById("status");
    const heading = document.getElementById("heading");
    const urduBtn = document.getElementById("urduBtn");
    const englishBtn = document.getElementById("englishBtn");
    const videoArea = document.getElementById("videoArea");

    function readProgress() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        savedPositions = { ...savedPositions, ...(data.positions || {}) };
        completed = { ...completed, ...(data.completed || {}) };
      } catch (e) {
        console.warn("Could not read tutorial progress.", e);
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          positions: savedPositions,
          completed: completed
        }));
      } catch (e) {
        console.warn("Could not save tutorial progress.", e);
      }
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
    }

    function updateLanguageButtons() {
      urduBtn.classList.toggle("active", currentLanguage === "ur");
      englishBtn.classList.toggle("active", currentLanguage === "en");

      heading.textContent = currentLanguage === "ur"
        ? "ڈرائیور ٹیوٹوریل"
        : "Driver Training Tutorial";
    }

    function showCompletedIfNeeded() {
      if (completed.ur && completed.en) {
        setStatus("Both tutorial videos have been completed in this browser.");
      }
    }

    // YouTube API calls this function after it loads.
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: VIDEOS[currentLanguage],
        playerVars: {
          autoplay: 0,
          controls: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin,
          rel: 0
        },
        events: {
          onReady: function () {
            ready = true;
            setStatus("Video ready. Press Play Video to start.");
            showCompletedIfNeeded();
          },

          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              setStatus(currentLanguage === "ur"
                ? "اردو ویڈیو چل رہی ہے۔"
                : "English video is playing.");
            }

            if (event.data === YT.PlayerState.PAUSED) {
              saveCurrentPosition();
              setStatus("Video paused. Your progress has been saved.");
            }

            if (event.data === YT.PlayerState.ENDED) {
              savedPositions[currentLanguage] = 0;
              completed[currentLanguage] = true;
              saveProgress();
              setStatus(
                (currentLanguage === "ur" ? "اردو" : "English") +
                " tutorial completed."
              );
            }
          },

          onError: function (event) {
            ready = false;

            const messages = {
              2: "Invalid video ID or video settings.",
              5: "YouTube could not play this video in the embedded player.",
              100: "Video not found or it may be private.",
              101: "The video owner does not allow embedding.",
              150: "Embedding is not allowed for this video.",
              153: "YouTube could not identify the embedding website. Check HTTPS and the HTTP Referer."
            };

            setStatus(
              "YouTube error " + event.data + ": " +
              (messages[event.data] || "Unable to load the video."),
              true
            );
          }
        }
      });
    };

    function saveCurrentPosition() {
      if (!ready || !player || typeof player.getCurrentTime !== "function") {
        return;
      }

      try {
        const time = player.getCurrentTime();
        if (Number.isFinite(time)) {
          savedPositions[currentLanguage] = time;
          saveProgress();
        }
      } catch (e) {
        console.warn("Could not save playback position.", e);
      }
    }

    function switchLanguage(language) {
      if (!ready || !player) {
        setStatus("Please wait for the video player to finish loading.");
        return;
      }

      if (language === currentLanguage) return;

      saveCurrentPosition();

      let time = savedPositions[currentLanguage] || 0;

      try {
        const currentTime = player.getCurrentTime();
        if (Number.isFinite(currentTime)) time = currentTime;
      } catch (e) {}

      currentLanguage = language;
      updateLanguageButtons();

      const targetTime = savedPositions[language] || time;

      setStatus("Loading " +
        (language === "ur" ? "Urdu" : "English") + " video...");

      player.loadVideoById({
        videoId: VIDEOS[language],
        startSeconds: Math.max(0, Math.floor(targetTime))
      });
    }

    document.getElementById("playBtn").addEventListener("click", function () {
      if (!ready || !player) {
        setStatus("Video player is still loading. Please wait.");
        return;
      }
      player.playVideo();
    });

    document.getElementById("resumeBtn").addEventListener("click", function () {
      if (!ready || !player) return;

      const time = savedPositions[currentLanguage] || 0;
      player.seekTo(time, true);
      player.playVideo();
    });

    document.getElementById("fullscreenBtn").addEventListener("click", async function () {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (videoArea.requestFullscreen) {
          await videoArea.requestFullscreen();
        } else {
          setStatus("Full screen is not supported by this browser.", true);
        }
      } catch (e) {
        setStatus("Could not open full screen. Please try again.", true);
      }
    });

    urduBtn.addEventListener("click", () => switchLanguage("ur"));
    englishBtn.addEventListener("click", () => switchLanguage("en"));

    document.getElementById("closeBtn").addEventListener("click", function () {
      saveCurrentPosition();
      document.getElementById("tutorial").hidden = true;
    });

    window.addEventListener("beforeunload", saveCurrentPosition);

    readProgress();

    // Save progress every 2 seconds.
    saveTimer = window.setInterval(saveCurrentPosition, 2000);

    // Load the official YouTube player API.
    const apiScript = document.createElement("script");
    apiScript.src = "https://www.youtube.com/iframe_api";
    apiScript.onerror = function () {
      setStatus(
        "YouTube API could not load. Check your internet connection, content blockers, and website security settings.",
        true
      );
    };
    document.head.appendChild(apiScript);
  </script>

</body>
</html>
