
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Tutorial Test</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#202938}
header{background:#173d32;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px}
.helpBtn{background:#e8bd62;color:#172b24;font-weight:bold}
.dashboard{padding:20px;max-width:1000px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px #0000000b}
.modal{position:fixed;inset:0;z-index:1000;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}
.modal.open{display:flex}
.tutorial{width:min(900px,100%);max-height:96dvh;overflow:auto;background:white;border-radius:14px;padding:16px}
.modalTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.languages,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.langBtn{background:#e9edf0;color:#222}
.langBtn.active{background:#173d32;color:white}
.closeBtn{background:#d93434;color:white}
.videoStage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:10px}
#player{position:absolute;inset:0;width:100%;height:100%}
.gestureLayer{position:absolute;inset:0;z-index:2;background:transparent;touch-action:manipulation}
.videoControls{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.videoControls button{pointer-events:auto}
.fullBtn{background:#ffffffed;color:#111;font-size:24px;font-weight:bold;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center}
.fullExitBtn{display:none;position:absolute;z-index:10;top:12px;right:12px;background:#ffffffed;color:#111;font-weight:bold}
.videoStage:fullscreen,.videoStage:-webkit-full-screen{width:100%;height:100%;aspect-ratio:auto;border-radius:0;background:#000}
.videoStage:fullscreen #player,.videoStage:-webkit-full-screen #player{width:100%;height:100%}
.videoStage:fullscreen .fullExitBtn,.videoStage:-webkit-full-screen .fullExitBtn{display:block}
.status{margin:12px 0;font-size:14px;color:#4b5563;line-height:1.7}
.actions button{background:#173d32;color:white}
.progressTrack{height:7px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:8px}
.progressFill{height:100%;width:0%;background:#d5a943}
@media(max-width:500px){.tutorial{padding:10px}.modalTop{align-items:flex-start}button{padding:9px 11px}.fullBtn{padding:0;width:44px;height:44px}}
</style>
</head>

<body>
<header>
  <strong>Driver Dashboard</strong>
  <button class="helpBtn" id="helpBtn">Help / Tutorial</button>
</header>

<main class="dashboard">
  <h2>Dashboard</h2>
  <div class="cards">
    <div class="card">New Invoice</div>
    <div class="card">Charge Setup</div>
    <div class="card">Target Setup</div>
    <div class="card">Leaves</div>
    <div class="card">Reports</div>
    <div class="card">Shift Summary</div>
  </div>
</main>

<div class="modal" id="modal">
  <section class="tutorial">
    <div class="modalTop">
      <div class="languages">
        <button class="langBtn active" id="urduBtn">اردو</button>
        <button class="langBtn" id="englishBtn">English</button>
      </div>
      <button class="closeBtn" id="closeBtn">Close ✕</button>
    </div>

    <div class="videoStage" id="videoStage">
      <div id="player"></div>
      <div class="gestureLayer" id="gestureLayer"></div>
      <div class="videoControls">
        <span></span>
        <button class="fullBtn" id="fullBtn" aria-label="Full Screen" title="Full Screen">⛶</button>
      </div>
      <button class="fullExitBtn" id="fullExitBtn">✕ Exit Full Screen</button>
    </div>

    <div class="status" id="status">Status: Pending</div>
    <div class="progressTrack">
      <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="actions" style="margin-top:14px">
      <button id="playPauseBtn">▶ Play</button>
    </div>
  </section>
</div>

<script>
const VIDEOS = {
  urdu: "xFGi__79snw",
  english: "EVV4h_WpcUo"
};

const STORAGE_KEY = "driverTutorialTestV5";
const STATUS_KEY = "driverTutorialStatusV1";

const modal = document.getElementById("modal");
const helpBtn = document.getElementById("helpBtn");
const closeBtn = document.getElementById("closeBtn");
const urduBtn = document.getElementById("urduBtn");
const englishBtn = document.getElementById("englishBtn");
const playPauseBtn = document.getElementById("playPauseBtn");
const fullBtn = document.getElementById("fullBtn");
const fullExitBtn = document.getElementById("fullExitBtn");
const videoStage = document.getElementById("videoStage");
const gestureLayer = document.getElementById("gestureLayer");
const statusBox = document.getElementById("status");
const progressFill = document.getElementById("progressFill");

let player = null;
let playerReady = false;
let currentLanguage = "urdu";
let progressTimer = null;
let singleTapTimer = null;
let lastSavedSecond = -1;

function readState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return {
      language: saved.language === "english" ? "english" : "urdu",
      positions: {
        urdu: Math.max(0, Number(saved.positions?.urdu) || 0),
        english: Math.max(0, Number(saved.positions?.english) || 0)
      }
    };
  }catch(e){
    return {language:"urdu",positions:{urdu:0,english:0}};
  }
}

let savedState = readState();
currentLanguage = savedState.language;

function getTutorialStatus(){
  return localStorage.getItem(STATUS_KEY) === "complete"
    ? "complete"
    : "pending";
}

function setTutorialStatus(status){
  try{
    localStorage.setItem(STATUS_KEY,status);
  }catch(e){}
  showStatus("Status: " + (status === "complete" ? "Complete" : "Pending"));
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      language:currentLanguage,
      positions:savedState.positions
    }));
  }catch(e){}
}

function savedPosition(){
  return Math.max(0,Math.floor(savedState.positions[currentLanguage] || 0));
}

function updateLanguageButtons(){
  urduBtn.classList.toggle("active",currentLanguage === "urdu");
  englishBtn.classList.toggle("active",currentLanguage === "english");
}

function showStatus(message){
  statusBox.textContent = message;
}

function openPopup(){
  modal.classList.add("open");
  if(playerReady && player){
    startProgressTimer();
  }
}

function closePopup(){
  saveCurrentPosition();
  stopProgressTimer();

  if(document.fullscreenElement === videoStage){
    document.exitFullscreen().catch(()=>{});
  }else if(document.webkitFullscreenElement === videoStage &&
           document.webkitExitFullscreen){
    document.webkitExitFullscreen();
  }

  if(playerReady && player){
    player.pauseVideo();
  }
  modal.classList.remove("open");
}

function saveCurrentPosition(){
  if(!playerReady || !player) return;

  try{
    if(player.getPlayerState() !== YT.PlayerState.ENDED){
      const seconds = Math.floor(player.getCurrentTime() || 0);
      if(seconds >= 0){
        savedState.positions[currentLanguage] = seconds;
      }
    }
    saveState();
  }catch(e){}
}

function startProgressTimer(){
  stopProgressTimer();

  progressTimer = setInterval(()=>{
    if(!playerReady || !player || !modal.classList.contains("open")) return;

    try{
      const duration = player.getDuration() || 0;
      const current = player.getCurrentTime() || 0;
      const state = player.getPlayerState();

      if(state === YT.PlayerState.PLAYING){
        const second = Math.floor(current);
        if(second !== lastSavedSecond){
          savedState.positions[currentLanguage] = second;
          lastSavedSecond = second;
          saveState();
        }
      }

      progressFill.style.width = duration > 0
        ? Math.min(100,current/duration*100) + "%"
        : "0%";

      if(getTutorialStatus() === "complete"){
        showStatus("Status: Complete");
      }else{
        showStatus("Status: Pending");
      }
    }catch(e){}
  },1000);
}

function stopProgressTimer(){
  if(progressTimer){
    clearInterval(progressTimer);
    progressTimer = null;
  }
}

function togglePlayPause(){
  if(!playerReady || !player) return;

  const state = player.getPlayerState();

  if(state === YT.PlayerState.PLAYING){
    saveCurrentPosition();
    player.pauseVideo();
    playPauseBtn.textContent = "▶ Play";
  }else{
    player.unMute();
    player.setVolume(100);
    player.playVideo();
    playPauseBtn.textContent = "⏸ Pause";
  }
}

function switchLanguage(language){
  if(language === currentLanguage) return;

  saveCurrentPosition();
  currentLanguage = language;
  savedState.language = language;
  saveState();
  updateLanguageButtons();
  progressFill.style.width = "0%";
  lastSavedSecond = -1;

  if(playerReady && player){
    player.loadVideoById({
      videoId:VIDEOS[currentLanguage],
      startSeconds:savedPosition()
    });
  }
}

async function enterFullscreen(){
  try{
    if(videoStage.requestFullscreen){
      await videoStage.requestFullscreen();
    }else if(videoStage.webkitRequestFullscreen){
      videoStage.webkitRequestFullscreen();
    }else if(player && player.getIframe()){
      player.getIframe().requestFullscreen?.();
    }else{
      showStatus("اس براؤزر میں فل اسکرین دستیاب نہیں۔");
    }
  }catch(e){
    showStatus("فل اسکرین کے لیے دوبارہ بٹن دبائیں۔");
  }
}

async function exitFullscreen(){
  try{
    if(document.fullscreenElement && document.exitFullscreen){
      await document.exitFullscreen();
    }else if(document.webkitFullscreenElement && document.webkitExitFullscreen){
      document.webkitExitFullscreen();
    }
  }catch(e){}
}

function toggleFullscreen(){
  if(document.fullscreenElement === videoStage ||
     document.webkitFullscreenElement === videoStage){
    exitFullscreen();
  }else{
    enterFullscreen();
  }
}

helpBtn.addEventListener("click",openPopup);
closeBtn.addEventListener("click",closePopup);
playPauseBtn.addEventListener("click",togglePlayPause);
fullBtn.addEventListener("click",toggleFullscreen);
fullExitBtn.addEventListener("click",exitFullscreen);
urduBtn.addEventListener("click",()=>switchLanguage("urdu"));
englishBtn.addEventListener("click",()=>switchLanguage("english"));

document.addEventListener("fullscreenchange",()=>{
  fullBtn.textContent = "⛶";
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState === "hidden"){
    saveCurrentPosition();
  }
});

window.addEventListener("pagehide",saveCurrentPosition);
window.addEventListener("beforeunload",saveCurrentPosition);

/* Single tap = Play/Pause; double tap = Full Screen */
gestureLayer.addEventListener("click",()=>{
  if(singleTapTimer){
    clearTimeout(singleTapTimer);
    singleTapTimer = null;
    toggleFullscreen();
  }else{
    singleTapTimer = setTimeout(()=>{
      singleTapTimer = null;
      togglePlayPause();
    },280);
  }
});

function loadYouTubeAPI(){
  if(document.getElementById("youtubeIframeApi")) return;
  const tag = document.createElement("script");
  tag.id = "youtubeIframeApi";
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player("player",{
    width:"100%",
    height:"100%",
    videoId:VIDEOS[currentLanguage],
    playerVars:{
      autoplay:0,
      controls:0,
      playsinline:1,
      rel:0,
      start:savedPosition(),
      enablejsapi:1,
      origin:location.origin
    },
    events:{
      onReady:function(event){
        playerReady = true;
        event.target.pauseVideo();
        event.target.seekTo(savedPosition(),true);
        updateLanguageButtons();
        startProgressTimer();
        showStatus("Status: " + (getTutorialStatus() === "complete" ? "Complete" : "Pending"));
      },
      onStateChange:function(event){
        if(event.data === YT.PlayerState.PLAYING){
          playPauseBtn.textContent = "⏸ Pause";
        }else if(event.data === YT.PlayerState.PAUSED){
          playPauseBtn.textContent = "▶ Play";
          saveCurrentPosition();
        }else if(event.data === YT.PlayerState.ENDED){
          savedState.positions[currentLanguage] = 0;
          saveState();
          progressFill.style.width = "100%";
          setTutorialStatus("complete");
          playPauseBtn.textContent = "▶ Play";
        }
      },
      onError:function(){
        showStatus("ویڈیو لوڈ نہیں ہو سکی۔ انٹرنیٹ اور YouTube ویڈیو کی دستیابی چیک کریں۔");
      },
      onAutoplayBlocked:function(){
        showStatus("ویڈیو چلانے کے لیے Play دبائیں۔");
      }
    }
  });
};

updateLanguageButtons();
loadYouTubeAPI();

window.addEventListener("load",()=>{
  if(getTutorialStatus() === "pending"){
    openPopup();
  }else{
    modal.classList.remove("open");
    showStatus("Status: Complete");
  }
});
</script>
</body>
</html>
